<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basketball Player</title>
    <link rel="stylesheet" href="stys.css">
</head>

<body>
    <div class="game-container">
        <div class="hud">
            <div>
                <span>PONTOS</span>
                <strong id="score">0</strong>
            </div>

            <div>
                <span>TEMPO</span>
                <strong id="timer">60</strong>
            </div>

            <div>
                <span>ARREMESSOS</span>
                <strong id="shots">0</strong>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div class="instructions">
            <p><b>← →</b> Mover</p>
            <p><b>↑ ↓</b> Ajustar força</p>
            <p><b>ESPAÇO</b> Arremessar</p>
        </div>

        <div id="gameOver" class="game-over hidden">
            <h1>FIM DE JOGO!</h1>
            <p>Pontuação: <strong id="finalScore">0</strong></p>
            <button id="restartButton">Jogar novamente</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
